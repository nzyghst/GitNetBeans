<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión · PitStop Express</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>try{var t=localStorage.getItem('ps-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <main class="section" style="min-height:100dvh;display:grid;place-items:center;text-align:center">
    <div class="container" style="max-width:520px">
      <div style="width:80px;height:80px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 24px">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a3 3 0 0 1 2.8-2h8.4A3 3 0 0 1 19 8l2 5v5h-3v-2H6v2H3z"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/><path d="M2 2l20 20"/></svg>
      </div>
      <h1 class="section-title" style="font-size:2rem">Estás sin conexión</h1>
      <p class="text-muted" style="margin:12px 0 24px">Parece que tu coche se ha quedado sin señal 📡. Comprueba tu conexión e inténtalo de nuevo. Las páginas que ya visitaste siguen disponibles.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary btn-lg" onclick="location.reload()">Reintentar</button>
        <a href="index.html" class="btn btn-ghost btn-lg">Ir al inicio</a>
      </div>
    </div>
  </main>
</body>
</html>
