# Publica la carpeta de muestras web como sitio estático
[build]
  publish = "sitios-web"

# La página de precios se retiró: el presupuesto se habla con cada negocio.
# force = true por si algún deploy incremental arrastra el archivo antiguo.
[[redirects]]
  from = "/precios"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/precios.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
